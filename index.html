  // Swipe kiri untuk padam (telefon & tetikus)
  (function () {
    var st = null, list = $('othMail');
    list.addEventListener('pointerdown', function (e) {
      var r = e.target.closest ? e.target.closest('.mrow') : null;
      if (!r || e.target.closest('input,button')) return;
      st = { r:r, x:e.clientX, y:e.clientY, dx:0, moved:false, id:e.pointerId };
    });
    list.addEventListener('pointermove', function (e) {
      if (!st || e.pointerId !== st.id) return;
      var dx = e.clientX - st.x, dy = e.clientY - st.y;
      if (!st.moved) {
        if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.5) { st.moved = true; try { st.r.setPointerCapture(e.pointerId); } catch (x) {} }
        else if (Math.abs(dy) > 12) { st = null; return; }
      }
      if (st && st.moved) {
        st.dx = Math.min(0, dx);
        st.r.style.transition = 'none'; st.r.style.transform = 'translateX(' + st.dx + 'px)';
        st.r.style.background = 'rgba(' + (document.documentElement.getAttribute('data-scheme') === 'uitm' ? '106,44,145' : '234,67,53') + ',' + Math.min(.35, Math.abs(st.dx) / 400) + ')';
      }
    });
    function end(e) {
      if (!st) return;
      var s = st; st = null;
      if (!s.moved) return;
      window._swiped = true; setTimeout(function () { window._swiped = false; }, 80);
      s.r.style.transition = 'transform .15s';
      var id = (s.r.getAttribute('onclick').match(/'([^']+)'/) || [])[1];
      if (s.dx < -Math.min(120, s.r.offsetWidth * 0.35) && id) {
        s.r.style.transform = 'translateX(-100%)';
        setTimeout(function () { quickDel(id); }, 150);
      } else { s.r.style.transform = ''; s.r.style.background = ''; }
    }
    list.addEventListener('pointerup', end);
    list.addEventListener('pointercancel', end);
  })();

      showM(nav + '<h3>' + esc(d.subject) + '</h3><div class="meta"><b>' + t('from') + ':</b> ' + esc(d.from) + '<br><b>' + t('to') + ':</b> ' + esc(d.to) +
        (d.cc ? '<br><b>' + t('cc') + ':</b> ' + esc(d.cc) : '') + '<br><b>' + t('date') + ':</b> ' + new Date(d.date).toLocaleString(loc()) + ' · ' + t('msgs', { n: d.count }) + '</div>' +
        '<iframe class="mframe" sandbox="allow-popups allow-popups-to-escape-sandbox" srcdoc="' + attr(threadDoc(d)) + '"></iframe><div class="actions">' + b + '</div>');

  // ===== KALENDAR =====
  function dayIdx(e) { var s = new Date(e.start), n = new Date(); s.setHours(0,0,0,0); n.setHours(0,0,0,0); return Math.max(0, Math.round((s - n) / 864e5)); }
  // Acara yang masa bertindih (bukan sepanjang hari, bukan tugas, bukan yang ditolak)
  function clashOf(e) {
    if (e.task || e.allDay || e.status === 'NO') return [];
    var s = new Date(e.start).getTime(), en = new Date(e.end).getTime(), now = Date.now();
    if (en < now) return [];   // acara yang sudah tamat tidak ditanda
    return (DATA.events || []).filter(function (o) {
      return o !== e && !o.task && !o.allDay && o.status !== 'NO' && new Date(o.end).getTime() >= now && new Date(o.start).getTime() < en && new Date(o.end).getTime() > s;
    });
  }
  function clashBox(e) {
    var c = clashOf(e); if (!c.length) return '';
    return '<div class="clashbx"><b>⚠ ' + t('clashTitle') + '</b>' + c.map(function (o) {
      return '<div>' + esc(o.title) + ' <span class="sub">' + fT(o.start) + ' – ' + fT(o.end) + '</span></div>';
    }).join('') + '</div>';
  }
  function clashLine(e) {
    var c = clashOf(e); if (!c.length) return '';
    var o = c[0], when = fT(o.start) + ' – ' + fT(o.end);
    return '<div class="clashln">⚠ ' + t('clashWith') + ' ' + esc(o.title) + ' (' + when + ')' + (c.length > 1 ? ' ' + t('clashMore', { n: c.length - 1 }) : '') + '</div>';
  }
  function evHtml(e, i, showDate) {

      var td = showDate ? new Date(e.start).toLocaleDateString(loc(), { weekday:'short', day:'numeric', month:'short' }) + ' · ' : '';
      return '<div class="ev tk' + (e.late ? ' late' : '') + '" onclick="openEvent(' + i + ')"><div class="row"><span class="t ell"><button class="tkb" aria-label="' + esc(t('tkDone')) + '" onclick="event.stopPropagation();doneTask(' + i + ')"></button>' + esc(e.title) +
        '</span><span class="when">' + td + (e.late ? t('tkLate') : t('tkTask')) + '</span></div></div>';
    }
    var tm = e.allDay ? t('allDay') : fT(e.start) + ' – ' + fT(e.end);
    var d = showDate ? new Date(e.start).toLocaleDateString(loc(), { weekday:'short', day:'numeric', month:'short' }) + ' · ' : '';
    var over = new Date(e.end) < new Date();
    var cln = clashLine(e);
    return '<div class="ev ' + (e.important ? 'imp ' : '') + (over ? 'over ' : '') + (cln ? 'clash ' : '') + e.status + '" onclick="openEvent(' + i + ')"><div class="row"><span class="t ell">' + esc(e.title) +
      '<span class="tag ' + e.status + '">' + t('st' + e.status) + '</span></span><span class="when">' + d + tm + '</span></div>' +
      (e.location ? '<div class="when ell">📍 ' + esc(e.location) + '</div>' : '') + cln +
      (over ? '<div class="evdone">' + t('evDone') + '</div>' : '') + '</div>';
  }
  function evSec(e) {
    if (e.task) return dayIdx(e) === 0 ? 'A' : 'N';

    if (e.force === 'oth') return 'O';
    if (e.force === 'imp') return dayIdx(e) === 0 ? 'A' : 'N';

    if (!other && e.important) return 'N';
    return 'O';
  }

    return s0.toLocaleDateString(loc(), o) + ', ' + fT(e.start) + ' –<br>' + en.toLocaleDateString(loc(), o) + ', ' + fT(e.end);
  }
  function urlOf(x) { var m = String(x || '').match(/https?:\/\/[^\s"'<>]+/); return m ? m[0] : ''; }

    var guests = (e.guestList || []).map(function (g) {

    var descH = plain ? '<div class="evr"><span class="ic">' + ico('doc') + '</span><iframe class="mframe" style="height:' + Math.min(320, 70 + Math.ceil(plain.length / 70) * 20) + 'px;margin:0" sandbox="allow-popups allow-popups-to-escape-sandbox" srcdoc="' + attr(mailDoc({ html: e.descHtml, body: '' })) + '"></iframe></div>' : '';
    showM('<div class="evh"><span class="dot" style="background:' + (e.important ? 'var(--red)' : 'var(--blue)') + '"></span><h3>' + esc(e.title) + '</h3></div>' +
      '<div class="evr"><span class="ic">' + ico('clock') + '</span><div>' + evWhen(e) + '</div></div>' + clashBox(e) +

      (e.creators ? '<div class="evr"><span class="ic">' + ico('user') + '</span><div><span class="sub">' + t('organizer') + '</span><br>' + esc(e.creators) + '</div></div>' : '') +

        (e.canRsvp ? '<div class="rsvp">' + [['YES', 'gr', 'check', 'rsvpA'], ['MAYBE', 'yl', 'help', 'rsvpM'], ['NO', 'pk', 'x', 'rsvpD']].map(function (r) {
          return '<button class="btn ' + r[1] + (e.status === r[0] ? ' cur' : '') + '" onclick="rsvpEv(' + i + ',\'' + r[0] + '\')">' + ico(r[2]) + t(r[3]) + '</button>';
        }).join('') + '</div>' : '') + '</div></div>' +

  var MAN = {"ms": [["Apa itu Read My Mail?", ["p:Paparan ringkas untuk emel Gmail dan kalendar Google anda. Ia menyusun emel yang perlu perhatian di atas, dan yang kurang penting di bawah, supaya anda tak perlu menyelongkar peti masuk.", "tip:Data anda hanya untuk anda. Setiap pengguna nampak emel dan kalendar akaun sendiri sahaja."]], ["1. Mula guna", ["li:Buka alamat app dalam Chrome (Android) atau Safari (iPhone).", "li:Tekan Log masuk dengan Google dan guna akaun UiTM (@uitm.edu.my).", "li:Android: tekan menu ⋮ Chrome, kemudian Pasang app / Add to Home screen. iPhone: tekan Kongsi, kemudian Tambah ke Skrin Utama.", "li:Jika diminta log masuk semula (kira-kira setiap sejam), tekan sahaja butang log masuk. Tetapan anda tidak hilang."]], ["2. Apa yang ada di skrin", ["li:PERLU TINDAKAN: emel yang anda perlu buat sesuatu. Satu kad pada satu masa, gelongsor kiri/kanan atau tekan anak panah.", "li:EMEL PENTING: emel penting yang belum perlu tindakan. Cara guna sama.", "li:EMEL LAIN: semua emel lain dalam senarai.", "li:KALENDAR: Hari ini, Akan datang (acara penting dan diterima), dan Perkara Lain (kurang penting, Maybe, atau ditolak).", "li:Bar bawah (telefon) atau tepi/atas (PC): pintasan ke GMAIL, CALENDAR, DRIVE dan GEMINI."]], ["3. Bagaimana emel disusun (automatik)", ["li:Penting: ditandai Important oleh Gmail, berbintang, daripada VIP anda, atau ada kata kunci penting.", "li:Perlu tindakan: ada frasa seperti \"sila hantar\" atau \"action required\". Jemputan mesyuarat biasa tidak dikira.", "li:Pengirim yang anda tandakan kurang penting terus masuk Emel Lain.", "p:Anda boleh sentiasa pindahkan emel sendiri dengan butang di bawah."]], ["4. Butang pada emel", ["li:Perlu Tindakan: Selesai (pindah ke Emel Lain) dan Padam.", "li:Emel Penting: Perlu tindakan, Kurang penting (emel ini sahaja, atau pengirim ini seterusnya), dan Padam.", "li:Emel Lain: tanda kotak di kiri, kemudian guna butang atas senarai untuk Perlu tindakan, Penting, atau Padam. Tekan tong sampah merah atau gelongsor ke kiri untuk padam terus.", "li:Padam bermaksud masuk Bin Gmail, boleh dipulihkan dalam 30 hari.", "li:Klik emel untuk baca. Ia ditanda sudah dibaca secara automatik. Di sana ada Open in Gmail, Teruskan, Balas, dan Balas semua (emel asal disertakan)."]], ["5. Kalendar", ["li:Klik acara untuk lihat masa, lokasi, tetamu dan huraian.", "li:Jika anda dijemput, ada butang Terima, Maybe dan Tolak. Jawapan dihantar kepada penganjur melalui Google Calendar.","li:Join untuk sertai mesyuarat dalam talian. Buka di Kalendar untuk paparan penuh Google Calendar.", "li:Alih ke Perkara Lain atau Alih ke Penting untuk tukar senarai acara itu. Pilihan anda diingat."]], ["6. Tetapan (butang ⚙)", ["li:Bahasa, tema warna (Google, UiTM, Jalur Gemilang atau Penang), mod warna (cerah, gelap, ikut sistem) dan kedudukan pintasan di PC.", "li:Senarai anda: pengirim VIP, kata kunci penting, pengirim kurang penting, frasa perlu tindakan, frasa mesyuarat, kata kunci acara. Satu item sebaris. Senarai asal sentiasa ada. Anda hanya tambah atau buang, dan boleh Pulihkan senarai lalai.", "li:Refresh automatik (saat), imbas emel (hari), dan bilangan hari kalendar akan datang (asal 5).", "li:Android: pilih sama ada pautan Gmail dibuka dalam app atau pelayar. App Gmail hanya boleh buka peti masuk, bukan satu emel tertentu. Pelayar boleh buka emel yang tepat."]], ["7. Masalah biasa", ["li:Data tak muncul atau lama: tekan ↻ di atas.", "li:Diminta log masuk lagi: biasa, kerana sesi Google tamat selepas kira-kira sejam. Log masuk semula.", "li:Ikon atau paparan tak berubah selepas kemas kini: tutup app sepenuhnya dan buka semula.", "li:Gemini terbuka di web: dari situ ada pilihan buka dalam app Gemini.", "li:iPhone: pautan Gmail dan kalendar dibuka melalui web, bukan terus ke app."]], ["8. Privasi", ["li:Emel dan kalendar dibaca terus oleh peranti anda daripada Google. Tiada pelayan lain terlibat.", "li:Tetapan dan pilihan anda disimpan dalam folder tersembunyi di Google Drive anda sendiri, dan sama di telefon dan PC.", "li:Hanya akaun UiTM yang boleh log masuk. Log keluar boleh dibuat dalam Tetapan."]]], "en": [["What is Read My Mail?", ["p:A quick view of your Gmail and Google Calendar. It puts mail that needs attention at the top and less important mail below, so you don't have to dig through your inbox.", "tip:Your data is only yours. Every user sees only their own mail and calendar."]], ["1. Getting started", ["li:Open the app address in Chrome (Android) or Safari (iPhone).", "li:Tap Sign in with Google and use your UiTM account (@uitm.edu.my).", "li:Android: tap the Chrome ⋮ menu, then Install app / Add to Home screen. iPhone: tap Share, then Add to Home Screen.", "li:If asked to sign in again (about every hour), just tap the sign-in button. Your settings are kept."]], ["2. What's on the screen", ["li:NEEDS ACTION: mail you need to do something about. One card at a time. Swipe left/right or use the arrows.", "li:IMPORTANT MAIL: important mail that doesn't need action yet. Works the same way.", "li:OTHER MAIL: all other mail, as a list.", "li:CALENDAR: Today, Upcoming (important and accepted events), and Others (less important, Maybe, or declined).", "li:Bottom bar (phone) or side/top (PC): shortcuts to GMAIL, CALENDAR, DRIVE and GEMINI."]], ["3. How mail is sorted (automatic)", ["li:Important: marked Important by Gmail, starred, from your VIPs, or containing important keywords.", "li:Needs action: contains phrases like \"please send\" or \"action required\". Plain meeting invitations don't count.", "li:Senders you mark as less important go straight to Other Mail.", "p:You can always move mail yourself with the buttons below."]], ["4. Email buttons", ["li:Needs Action: Done (moves to Other Mail) and Delete.", "li:Important Mail: Needs action, Less important (this email only, or this sender from now on), and Delete.", "li:Other Mail: tick the box on the left, then use the buttons above the list for Needs action, Important, or Delete. Tap the red bin or swipe left to delete straight away.", "li:Delete means it goes to the Gmail Bin, recoverable for 30 days.", "li:Tap an email to read it. It is marked as read automatically. There you have Open in Gmail, Forward, Reply, and Reply all (the original email is included)."]], ["5. Calendar", ["li:Tap an event to see time, location, guests and description.", "li:If you are invited, there are Accept, Maybe and Decline buttons. Your response is sent to the organiser through Google Calendar.","li:Join to enter an online meeting. Open in Calendar for the full Google Calendar view.", "li:Move to Others or Move to Important to change which list that event is in. Your choice is remembered."]], ["6. Settings (⚙ button)", ["li:Language, colour theme (Google, UiTM, Jalur Gemilang or Penang), colour mode (light, dark, follow system) and shortcut position on PC.", "li:Your lists: VIP senders, important keywords, less important senders, action phrases, meeting phrases, event keywords. One item per line. The default lists always apply. You only add or remove, and you can Restore default lists.", "li:Auto refresh (seconds), scan inbox (days), and upcoming calendar days (default 5).", "li:Android: choose whether Gmail links open in the app or the browser. The Gmail app can only open the inbox, not one specific email. The browser can open the exact email."]], ["7. Common problems", ["li:Data missing or old: tap ↻ at the top.", "li:Asked to sign in again: normal, Google sessions expire after about an hour. Sign in again.", "li:Icon or screen didn't change after an update: close the app completely and reopen it.", "li:Gemini opens on the web: from there you can choose to open the Gemini app.", "li:iPhone: Gmail and calendar links open on the web, not directly in the app."]], ["8. Privacy", ["li:Mail and calendar are read straight from Google by your own device. No other server is involved.", "li:Your settings and choices are stored in a hidden folder in your own Google Drive, and are the same on phone and PC.", "li:Only UiTM accounts can sign in. You can sign out in Settings."]]]};

    var keepY = $('ov').style.display === 'flex' ? $('modal').scrollTop : 0;
    showM('<h3>' + t('setTitle') + ' <small id="sSaved" style="font-weight:400;color:var(--green);opacity:0;transition:opacity .3s"></small></h3><div class="meta">' + t('setNote') + '</div>' +
      '<label class="lbl">' + t('fLang') + '</label>' + radios('sLang', s.lang || 'en', [['ms', 'Bahasa Melayu'], ['en', 'English']]) +
      '<label class="lbl">' + t('fScheme') + '</label>' + schemePick(s.scheme || 'google') +
      '<label class="lbl">' + t('fTheme') + '</label>' + radios('sTheme', s.theme || 'system', [['system', t('thSys')], ['light', t('thLight')], ['dark', t('thDark')]]) +
      '<label class="lbl">' + t('fReplyMode') + '</label>' + radios('sRM', s.replyMode || 'compose', [['compose', t('rmCompose')], ['gmail', t('rmGmail')]]) +
      '<label class="lbl">' + t('fReplyPos') + '</label>' + radios('sRP', s.replyPos || 'top', [['top', t('rpTop')], ['bottom', t('rpBot')]]) +
      '<label class="lbl">' + t('fNavPos') + '</label>' + radios('sNav', s.navPos || 'side', [['side', t('navSide')], ['top', t('navTop')]]) +
      (ANDROID ? '<label class="lbl">' + t('fOpen') + '</label>' + radios('sOpen', cached('rmm_open', 'app'), [['app', t('openApp')], ['web', t('openWeb')]]) : '') +
      '<label class="lbl">' + t('fAuto') + '</label>' + radios('sAuto', s.autoDemote ? 'move' : 'keep', [['keep', t('autoKeep')], ['move', t('autoMove')]]) +
      fld(t('fVip'), 'sVip', s.vip) + fld(t('fKw'), 'sKw', s.keywords) + fld(t('fMute'), 'sMute', s.muted) +
      fld(t('fAct'), 'sAct', s.actionWords) + fld(t('fMeet'), 'sMeet', s.meetingWords) + fld(t('fEv'), 'sEv', s.eventKeywords) +
      '<label class="lbl">' + t('fRef') + '</label><input id="sRef" type="number" min="30" max="600" value="' + (s.refresh || 60) + '">' +
      '<label class="lbl">' + t('fCal') + '</label><input id="sCal" type="number" min="1" max="30" value="' + (s.calDays || 5) + '">' +
      '<label class="lbl">' + t('fDays') + '</label><input id="sDays" type="number" min="1" max="30" value="' + (s.days || 7) + '">' +
      '<div class="actions" style="margin-top:14px"><button class="btn ghost" onclick="resetSet()">' + t('resetLists') + '</button><button class="btn ghost" onclick="RMM.signOut()">' + t('signOut') + '</button><button class="btn ghost" onclick="closeM()">' + t('close') + '</button></div>');
    $('modal').onchange = autoSave; $('modal').scrollTop = keepY;
  }
  var saveTimer = null, saving = false, again = false, setDirty = false;
  function autoSave() { clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 350); }
  function doSave() {
    if (saving) { again = true; return; }
    saving = true;
    var L = function (id) { return $(id).value.split(/\n|,/).map(function (x) { return x.trim(); }).filter(Boolean); };
    var data = { vip:L('sVip'), keywords:L('sKw'), muted:L('sMute'), actionWords:L('sAct'), meetingWords:L('sMeet'), eventKeywords:L('sEv'),
                 refresh:$('sRef').value, days:$('sDays').value, calDays:$('sCal').value, lang:rv('sLang'), scheme:rv('sScheme'), theme:rv('sTheme'), navPos:rv('sNav'), replyPos:rv('sRP'), replyMode:rv('sRM'), autoDemote:rv('sAuto') === 'move' };
    if (rv('sOpen')) { try { localStorage.setItem('rmm_open', rv('sOpen')); } catch (e) {} }
    var oldLang = LANG;
    RMM.run.withSuccessHandler(function (st) {
      saving = false; setDirty = true;
      if (data.scheme && st.scheme !== data.scheme) { toast(LANG === 'ms' ? 'Versi lama app masih dimuatkan. Tutup app sepenuhnya dan buka semula.' : 'An older app version is still loaded. Fully close and reopen the app.'); }
      DATA.settings = st; applyPrefs(); render();
      if (LANG !== oldLang) openSettings();
      var sv = $('sSaved'); if (sv) { sv.textContent = t('autoSaved'); sv.style.opacity = 1; setTimeout(function () { var e = $('sSaved'); if (e) e.style.opacity = 0; }, 1800); }
      if (again) { again = false; doSave(); }
    }).withFailureHandler(function (e) { saving = false; again = false; fail(e); }).saveSettings(data);
  }
  function resetSet() {
    RMM.run.withSuccessHandler(function (st) { DATA.settings = st; closeM(); load(); toast(t('toastReset')); })
      .withFailureHandler(function (e) { closeM(); fail(e); }).resetLists();
  }

  // ===== BUTANG PINTASAN: INBOX, SENT, CALENDAR, DRIVE, GEMINI =====
  // Android: Gmail/Calendar/Drive buka apl. Gemini buka web (ada butang buka app di sana).
  function renderNav() {
    var me = encodeURIComponent(DATA.me || ''), g = 'https://mail.google.com/mail/?authuser=' + me + '#';
    var items = [
      [ico('mail'), 'GMAIL',    g + 'inbox',  'mail.google.com',     '/mail/',     'com.google.android.gm', 1],
      [ico('cal'), 'CALENDAR', 'https://calendar.google.com/calendar/r?authuser=' + me, 'calendar.google.com', '/calendar/', 'com.google.android.calendar'],
      [ico('task'), 'TASKS',    'https://tasks.google.com/tasks/?authuser=' + me, 'tasks.google.com', '/tasks/', 'com.google.android.apps.tasks', 1],
      [ico('cloud'), 'DRIVE',    'https://drive.google.com/drive/my-drive?authuser=' + me, 'drive.google.com', '/drive/', 'com.google.android.apps.docs'],
      [ico('spark'), 'GEMINI',   'https://gemini.google.com/app?authuser=' + me, 'gemini.google.com', '/app', null]
    ];
    $('nav').innerHTML = items.map(function (x) {
      var fb = ';S.browser_fallback_url=' + encodeURIComponent(x[2]) + ';end';
      // Gmail & Gemini tidak mengendalikan pautan web https -> buka app melalui 'launcher intent'.
      // Calendar & Drive memang mengendalikan pautan web, jadi kekal guna pautan.
      var href = (!appMode() || !x[5]) ? x[2]
        : x[6] ? launcher(x[5], x[2])
        : 'intent://' + x[3] + x[4] + '#Intent;scheme=https;package=' + x[5] + fb;
      return '<a class="nv" href="' + esc(href) + '" target="' + (x[5] ? tgt() : '_blank') + '" rel="noopener"><span class="ic">' + x[0] + '</span><span>' + x[1] + '</span></a>';
    }).join('');
  }

  // ===== UMUM =====
  function renderStats() {
    var now = new Date(), td = now.toDateString(), s0 = new Date(now); s0.setHours(0, 0, 0, 0);
    var dow = (now.getDay() + 6) % 7, wkEnd = s0.getTime() + (7 - dow) * 86400000;
    var em = DATA.emails || [], ev = (DATA.events || []).filter(function (e) { return e.status !== 'NO' && !e.task; });
    var nToday = ev.filter(function (e) { return new Date(e.start).getTime() < s0.getTime() + 86400000 && new Date(e.end).getTime() > s0.getTime(); }).length;
    var nWeek = ev.filter(function (e) { return new Date(e.start).getTime() < wkEnd && new Date(e.end).getTime() > s0.getTime(); }).length;
    var items = [
      [actList().length, 'stAct', 'c1', '.s-act'],
      [impList().length, 'stImp', 'c2', '.s-imp'],
      [othList().filter(function (m) { return m.unread; }).length, 'stUnr', 'c3', '.s-oth'],
      [(DATA.todayCount != null ? DATA.todayCount : em.filter(function (m) { return new Date(m.date).toDateString() === td; }).length) + (DATA.todayStale ? '*' : ''), 'stNew', 'c4', '.s-oth'],
      [nToday, 'stToday', 'c5', '.s-today'],
      [nWeek, 'stWeek', 'c6', '.s-next']
    ];
    $('stats').innerHTML = items.map(function (x, i) {
      var lab = t(x[1]);
      return (i === 4 ? '<i class="sep"></i>' : '') + '<button class="st ' + x[2] + '" title="' + esc(lab.replace('|', ' ')) + '" onclick="goSec(\'' + x[3] + '\')"><b>' + x[0] + '</b><span>' + esc(lab).replace('|', '<br>') + '</span></button>';
    }).join('');
  }
  function goSec(sel) {
    if (sel === 'GM') { window.open('https://mail.google.com/mail/?authuser=' + encodeURIComponent(DATA.me) + '#search/' + encodeURIComponent(DATA.todayQ || 'newer_than:1d'), tgt()); return; }
    var e = document.querySelector(sel); if (e && e.scrollIntoView) e.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function render() {
    applyPrefs();
    var valid = {}; DATA.emails.forEach(function (m) { valid[m.id] = 1; });
    Object.keys(sel).forEach(function (k) { if (!valid[k]) delete sel[k]; });
    renderAct(); renderImp(); renderOth(); renderCal(); renderNav(); renderStats();
    $('upd').textContent = t('updated') + ' ' + fT(DATA.updated);
  }
  function showM(h) { $('modal').innerHTML = h; $('ov').style.display = 'flex'; }
  function closeM() { $('ov').style.display = 'none'; clearTimeout(saveTimer); if (setDirty && !saving) { setDirty = false; load(); } }
  function toast(m) {
    var e = $('toast'); e.textContent = m; e.style.display = 'block';
    clearTimeout(window._tt); window._tt = setTimeout(function () { e.style.display = 'none'; }, 6000);
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeM();
    else if ($('ov').style.display !== 'flex' && !/INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '')) {
      var st = focusCar === 'act' ? stepA : step, idx = focusCar === 'act' ? actIdx : impIdx;
      if (e.key === 'ArrowLeft' && idx > 0) st(-1); if (e.key === 'ArrowRight') st(1);
    }
  });

  document.documentElement.setAttribute('data-theme', cached('rmm_theme', 'system'));
  setScheme(cached('rmm_scheme', 'google'));
  /* Statistik (GoatCounter): kiraan tanpa nama sahaja. Emel, nama dan kandungan TIDAK dihantar. */
  function track(path, title) {
    var tries = 0;
    (function go() {
      try { if (window.goatcounter && window.goatcounter.count) { window.goatcounter.count({ path: 'readmymail/' + path, title: title, event: true }); return; } } catch (e) { return; }
      if (++tries < 20) setTimeout(go, 500);
    })();
  }
  window.addEventListener('appinstalled', function () { track('install', 'App dipasang'); });
  try {
    var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
    if (standalone && !sessionStorage.getItem('rmm_tracked')) { sessionStorage.setItem('rmm_tracked', '1'); track('buka-app', 'Dibuka sebagai app (skrin utama)'); }
  } catch (e) {}
  applyLang();
  window.addEventListener('load', function () { load(); });
  (function tick() {
    setTimeout(function () { if (Date.now() >= nextAt && !document.hidden && $('ov').style.display !== 'flex' && $('auth').style.display !== 'flex') load(); tick(); }, 10000);
  })();
  // Swipe kiri/kanan pada kad (telefon) + ingat carousel yang terakhir disentuh untuk papan kekunci
  function swipeCard(card, which, len, go, idx) {
    var x0 = null;
    card.parentNode.parentNode.addEventListener('pointerdown', function () { focusCar = which; });
    card.parentNode.parentNode.addEventListener('mouseenter', function () { focusCar = which; });
    card.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive:true });
    card.addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (dx < -50 && idx() < len() - 1) go(1); else if (dx > 50 && idx() > 0) go(-1);
    });
  }
  swipeCard($('card'), 'imp', function () { return impList().length; }, step, function () { return impIdx; });
  swipeCard($('acard'), 'act', function () { return actList().length; }, stepA, function () { return actIdx; });
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});</script>
